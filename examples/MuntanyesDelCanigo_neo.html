// Estrofas/secciones: empiezan al principio y tras cada doble barra.
// Se nombran con su indicación ("Estrofa 2 · Andante" → "Estrofa 2").
const NM = DATA.parts[0].measures.length;
const labelAt = i => DATA.parts.map(q => q.measures[i] && q.measures[i].w).find(Boolean);
const endAt = i => DATA.parts.some(q => q.measures[i] && q.measures[i].end);
const SECTIONS = []; const secOf = [];
for (let i = 0; i < NM; i++) {
  if (i === 0 || endAt(i - 1)) {
    const l = (labelAt(i) || '').split(' · ')[0];
    SECTIONS.push({ name: l && !/^rit/i.test(l) ? l : `Parte ${SECTIONS.length + 1}`, from: i + 1 });
  }
  secOf[i] = SECTIONS.length - 1;
}
const STORE = 'neo-secs:' + DATA.title;
// por defecto: las indicadas al generar (--estrofas) o todas; luego manda lo último elegido en este navegador
let shown = new Set((DATA.shown || SECTIONS.map((_, k) => k)).filter(k => k >= 0 && k < SECTIONS.length));
try { const s = JSON.parse(localStorage.getItem(STORE)); if (Array.isArray(s) && s.length) shown = new Set(s.filter(k => k < SECTIONS.length)); } catch (e) {}

function layout() {
  const P = DATA.parts[part], Q = +zoom.value;
  const notes = P.measures.flatMap(m => m.e).filter(e => !e.r);
  const lo = Math.min(...notes.map(e => e.p)), hi = Math.max(...notes.map(e => e.p));
  const first = notes[0].p, rows = hi - lo + 1, GH = rows * ROW;
  // ancho de cada evento: proporcional a la duración, pero sin pisar la sílaba
  const measures = P.measures.map((m, i) => {
    const evs = m.e.map(e => ({ ...e, w: Math.max(e.d * Q, e.t ? textW(e.t) + 6 : 6) }));
    // las indicaciones ("Estrofa 2"...) suelen estar solo en la voz de arriba: se toman de cualquier voz
    const label = m.w || DATA.parts.map(q => q.measures[i] && q.measures[i].w).find(Boolean);
    return { i, evs, w: evs.reduce((s, e) => s + e.w, 0) + 4, label, end: m.end || endAt(i) };
  }).filter(m => shown.has(secOf[m.i]));   // solo las estrofas elegidas
  const maxW = score.clientWidth - 32 - 40;   // padding de main + margen izquierdo y barras
  // reparte los compases en líneas; tras una doble barra (fin de estrofa) empieza línea nueva
  const lines = []; let cur = [], cw = 0;
  for (const m of measures) {
    if (cur.length && cw + m.w > maxW) { lines.push(cur); cur = []; cw = 0; }
    cur.push(m); cw += m.w;
    if (m.end) { lines.push(cur); cur = []; cw = 0; }
  }
  if (cur.length) lines.push(cur);

  const LBL_H = lines.some(l => l.some(m => m.label)) ? 14 : 0;   // franja para "Estrofa 2", "rit."...
  const y = p => TEXT_H + (hi - p) * ROW;
  score.innerHTML = lines.map(line => {
    const W = 30 + line.reduce((s, m) => s + m.w, 0);
    let s = `<svg width="${W}" height="${LBL_H + TEXT_H + GH + 4}" role="img"><g transform="translate(0 ${LBL_H})">`;
    let lx = 30;
    for (const m of line) { if (m.label) s += `<text class="lbl" x="${lx + 3}" y="-3">${m.label}</text>`; lx += m.w; }
    for (let p = lo; p <= hi; p++) {
      const ref = (p - first) % 12 === 0;
      s += `<line x1="30" x2="${W}" y1="${y(p) + ROW / 2}" y2="${y(p) + ROW / 2}" stroke="var(${ref ? '--ref' : '--grid'})" stroke-width="${ref ? 1.2 : 0.6}"/>`;
    }
    let x = 30, pts = [], prev = null;
    for (const m of line) {
      s += `<line x1="${x}" x2="${x}" y1="${TEXT_H - 4}" y2="${TEXT_H + GH}" stroke="var(--bar)" stroke-width="1"/>`;
      s += `<text class="mnum" x="${x + 2}" y="${TEXT_H + GH + 11}">${m.i + 1}</text>`;
      x += 2;
      for (const e of m.evs) {
        if (e.r) { if (pts.length) { s += poly(pts); pts = []; } prev = null; x += e.w; continue; }
        if (e.t) s += `<text class="syl" x="${x + 1}" y="${TEXT_H - 6}">${e.t}</text>`;
        const k = ((e.p - first) % 12 + 12) % 12, yy = y(e.p);
        const join = (e.tie || !e.t) && prev === e.p;   // ligadura o melisma en la misma nota
        s += `<rect x="${x + (join ? -1 : 1)}" y="${yy}" width="${e.w - (join ? 1 : 2)}" height="${ROW}" rx="1.5" fill="${color(k)}"/>`;
        pts.push([x + 1, yy + ROW / 2], [x + e.w - 1, yy + ROW / 2]);
        prev = e.p; x += e.w;
      }
      x += 2;
    }
    if (pts.length) s += poly(pts);
    return s + `<line x1="${x}" x2="${x}" y1="${TEXT_H - 4}" y2="${TEXT_H + GH}" stroke="var(--bar)"/></g></svg>`;
  }).join('');

  const used = new Set(notes.map(e => ((e.p - first) % 12 + 12) % 12));
  document.getElementById('legend').innerHTML =
    [...Array(12).keys()].filter(k => used.has(k)).map(k =>
      `<span><i style="background:${color(k)}"></i>${k === 0 ? 'primera nota' : '+' + k}<small>&nbsp;(${NAMES[(first + k) % 12]})</small></span>`).join('');
}
const poly = pts => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="0.7" opacity="0.7"/>`;

const vbox = document.getElementById('voices');
vbox.innerHTML = 'Voz ' + DATA.parts.map((p, i) => `<button data-i="${i}">${p.name}</button>`).join('');
const mark = () => vbox.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === part));
vbox.onclick = e => { if (e.target.dataset.i) { part = +e.target.dataset.i; mark(); layout(); } };
zoom.oninput = layout; addEventListener('resize', layout);
// desplegable de estrofas (solo si la canción tiene más de una)
const secs = document.getElementById('secs'), seclist = document.getElementById('seclist');
function secSummary() {
  const n = shown.size;
  secs.querySelector('summary').textContent = n === SECTIONS.length ? 'Todas las estrofas'
    : n === 0 ? 'Ninguna estrofa' : 'Estrofas: ' + [...shown].sort((a, b) => a - b).map(k => SECTIONS[k].name.replace(/^Estrofa\s*/i, '')).join(', ');
}
function secRender() {
  seclist.innerHTML = `<label class="all"><input type="checkbox" data-all ${shown.size === SECTIONS.length ? 'checked' : ''}> Todas</label>` +
    SECTIONS.map((s, k) => `<label><input type="checkbox" data-k="${k}" ${shown.has(k) ? 'checked' : ''}> ${s.name} <small style="color:var(--muted)">(c. ${s.from})</small></label>`).join('');
  secSummary();
}
seclist.onchange = e => {
  if (e.target.dataset.all !== undefined) shown = new Set(e.target.checked ? SECTIONS.map((_, k) => k) : []);
  else e.target.checked ? shown.add(+e.target.dataset.k) : shown.delete(+e.target.dataset.k);
  try { localStorage.setItem(STORE, JSON.stringify([...shown])); } catch (err) {}
  secRender(); layout();
};
document.addEventListener('click', e => { if (!secs.contains(e.target)) secs.open = false; });
if (SECTIONS.length > 1) { secs.hidden = false; secRender(); }

mark(); layout();
</script>
</body>
</html>
