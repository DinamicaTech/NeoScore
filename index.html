<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoScore · neo-partitura</title>
<link rel="stylesheet" href="css/neopartitura.css">
</head>
<body>
<!-- Piezas de la página (cada una en su fichero, para poder cambiarlas por separado):
     js/pagina.js          selector de partituras, abrir fichero propio, aviso de derechos y carga
     js/convertir.js       "Convertir con Claude": el prompt para pasar fotos o un PDF a MusicXML en claude.ai
     js/biblioteca.js     índice de la biblioteca (biblioteca/indice.json) y partitura propia guardada
     js/lector-musicxml.js lectura del MusicXML
     js/controles.js       controles de la cabecera (voz, estrofas, tamaño)
     js/estrofas.js        estrofas de la partitura
     js/dibujo.js          dibujo de la neo-partitura y la leyenda
     js/pentagrama.js      vista de pentagrama clásico (OpenSheetMusicDisplay), con varias voces de colores
     js/pentagrama-xml.js  el MusicXML que dibuja el pentagrama: voces que se ven, estrofas elegidas y tu letra
     js/letra.js           vista de letra: solo la letra, por estrofas y versos, de una voz o de un fichero .txt
     js/sonido.js          nota de referencia: tocar una sílaba la hace sonar (Tone.js)
     js/reproductor.js     reproductor: la partitura entera al tempo, con pausa, acompañamiento y micrófono
     js/reproduccion.js    cálculos del reproductor (reloj con pausa, qué nota suena)
     js/revision.js        repaso al acabar: las sílabas desafinadas, para oírlas y repetir su compás
     js/canto.js           escuchar al cantante con el micrófono (pitchy) y dibujar lo cantado
     js/afinacion.js       cálculos del canto (orden y momento de las notas, afinada / alta / baja)
     css/neopartitura.css   estilos -->
<header>
  <div class="ctrl" id="elegir"><select id="selector" title="Elegir una partitura de la biblioteca, o la tuya guardada en este navegador"></select><button id="abrir" title="Abrir una partitura MusicXML (.musicxml) o solo su letra en un fichero de texto (.txt: un verso por línea y una línea en blanco entre estrofas) de tu equipo; se queda solo en este navegador, no se sube a ningún sitio">Abrir fichero…</button><button id="convertir" title="Convertir en MusicXML una partitura en fotos o PDF: abre Claude en otra pestaña con las instrucciones; allí adjuntas los ficheros y luego abres aquí el resultado con Abrir fichero… (hace falta una cuenta de Claude)">Convertir con Claude</button><button id="olvidar" hidden title="Borrar de este navegador la partitura propia guardada (y su letra .txt, si le abriste una)">Olvidar la mía</button><button id="olvidar-letra" hidden title="Borrar de este navegador la letra .txt que abriste para esta partitura; la vista Letra volverá a usar la de la partitura">Olvidar mi letra</button><input type="file" id="fichero" accept=".musicxml,.xml,.txt" hidden></div>
  <h1 id="titulo"></h1>
  <div class="ctrl" id="vista" hidden></div>
  <div class="ctrl" id="voices"></div>
  <details class="ctrl" id="secs" hidden title="Elegir qué estrofas se ven"><summary></summary><div id="seclist"></div></details>
  <div class="ctrl" id="sonido" hidden title="Elige con qué sonido se oye la nota al tocar una sílaba">Sonido</div>
  <div class="ctrl" id="reproductor" hidden><button id="play">▶ Reproducir</button><button id="reiniciar" disabled title="Volver al principio de la partitura">⏮</button><label title="Velocidad: negras por minuto">Tempo <input type="number" id="tempo" min="30" max="200" step="5" value="80"></label><details id="acomp" hidden title="Sumar otras voces, más suaves que la tuya, para oír la armonía"><summary>Acompañamiento</summary><div id="acomplist"></div></details><button id="terminar" hidden>⏹ Terminar</button><button id="micro" aria-pressed="false">🎤 Micrófono</button><select id="margen" hidden title="Cuánto te puedes desviar de la nota para que cuente como afinada"></select><button id="repaso-btn" hidden title="Ver el repaso de tu último intento con el micrófono: las sílabas que salieron altas o bajas, para oírlas y repetirlas">📋 Repaso</button></div>
  <div class="ctrl" id="tamano" hidden>Tamaño <input type="range" id="zoom" min="12" max="70" value="40" title="Hacer la partitura más ancha o más estrecha"></div>
</header>
<p id="derechos" hidden></p>
<div id="aviso"></div>
<div id="legend"></div>
<div id="estado-repro" hidden><span id="estado-texto"></span><span id="mandos"><button id="play2"></button><button id="reiniciar2" title="Volver al principio de la partitura">⏮</button><button id="terminar2" hidden>⏹</button></span></div>
<section id="repaso" hidden aria-label="Repaso de lo desafinado"></section>
<main id="score"></main>
<script type="module" src="js/pagina.js"></script>
<script type="module" src="js/sonido.js"></script>
<script type="module" src="js/reproductor.js"></script>
<script type="module" src="js/revision.js"></script>
</body>
</html>
